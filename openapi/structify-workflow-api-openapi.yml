openapi: 3.2.0
info:
  contact:
    email: team@structify.ai
    name: Structify Team
  description: Every enterprise's data team.
  license:
    name: Discuss directly with founders for license.
    url: https://structify.ai
  title: Structify Workflow API
  version: 0.1.0
servers:
- description: Production server
  url: https://api.structify.ai
- description: Local server
  url: http://localhost:8080
security:
- api_key: []
- session_token: []
tags:
- name: Workflow
paths:
  /sessions/node/{node_id}/logs:
    get:
      operationId: get_node_logs
      parameters:
      - description: Workflow session node ID
        in: path
        name: node_id
        required: true
        schema:
          $ref: '#/components/schemas/WorkflowSessionNodeId'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetNodeLogsResponse'
          description: Node logs retrieved successfully
        '404':
          description: Node not found
        '500':
          description: Internal server error
      summary: Get terminal logs for a workflow node
      tags:
      - Workflow
  /workflow/run:
    post:
      operationId: run_workflow
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunWorkflowRequest'
        required: true
      responses:
        '200':
          description: Successfully started workflow
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Invalid request
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden - user does not have write access to chat session
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Chat session not found
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal server error
      security:
      - api_key: []
      - session_token: []
      tags:
      - Workflow
      summary: Run workflow
      x-summary-source: derived
  /workflow/stop:
    post:
      operationId: stop_workflow
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StopWorkflowRequest'
        required: true
      responses:
        '200':
          description: Successfully stopped workflow
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Invalid request
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden - user does not have write access to workflow session
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Workflow session not found
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal server error
      security:
      - api_key: []
      - session_token: []
      tags:
      - Workflow
      summary: Stop workflow
      x-summary-source: derived
components:
  schemas:
    RunWorkflowRequest:
      properties:
        chat_session_id:
          $ref: '#/components/schemas/ChatSessionId'
        edited_node_name:
          type:
          - string
          - 'null'
        use_node_cache:
          type: boolean
      required:
      - chat_session_id
      - use_node_cache
      type: object
    WorkflowSessionNodeId:
      format: uuid
      type: string
    WorkflowNodeLog:
      properties:
        content:
          type: string
        id:
          $ref: '#/components/schemas/WorkflowNodeLogId'
        is_stderr:
          type: boolean
        node_id:
          $ref: '#/components/schemas/WorkflowSessionNodeId'
        timestamp:
          format: date-time
          type: string
      required:
      - id
      - node_id
      - timestamp
      - is_stderr
      - content
      type: object
    WorkflowNodeLogId:
      format: uuid
      type: string
    StopWorkflowRequest:
      properties:
        workflow_session_id:
          $ref: '#/components/schemas/WorkflowSessionId'
      required:
      - workflow_session_id
      type: object
    ChatSessionId:
      format: uuid
      type: string
    ErrorResponse:
      description: Standard error response
      properties:
        error:
          type: string
      required:
      - error
      type: object
    WorkflowSessionId:
      format: uuid
      type: string
    GetNodeLogsResponse:
      properties:
        logs:
          items:
            $ref: '#/components/schemas/WorkflowNodeLog'
          type: array
      required:
      - logs
      type: object
  securitySchemes:
    api_key:
      in: header
      name: api_key
      type: apiKey
    session_token:
      scheme: bearer
      type: http
