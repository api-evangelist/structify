    Message:
      description: Our generic definition of a message to a chat agent.
      properties:
        content:
          description: 'We want this to be a vec of contents so we can accurately

            capture an interleaving of images and text.


            This is meant to be a completely raw, unprocessed representation

            of the text. Don''t take stuff out.'
          items:
