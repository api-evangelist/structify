    LlmInformationStore:
      description: 'Information store for connector schema


        Hierarchical structure: Connector → Database → Schema → Table → Column

        Works for both relational databases and API-based data.

        Distinguishes between the two by presence of `endpoint` on tables:

        - Relational DB: all tables have `endpoint: None`

        - API: all tables have `endpoint: Some(...)`'
      properties:
        databases:
          description: List of databases in this connector
          items:
            $ref: '#/components/schemas/ConnectorDatabaseInfo'
          type: array
        uses_default_hierarchy:
          description: 'Whether this store uses default auto-generated database/schema names

            (i.e., database and schema names match the connector name).

            When true, UIs should hide the database/schema hierarchy.

            When false, UIs should show the full database → schema → table hierarchy.'
          type: boolean
      required:
      - databases
      - uses_default_hierarchy
      type: object
    ConnectorTable:
      description: Represents a table (for relational databases) or resource (for APIs)
      properties:
        columns:
          description: List of columns in this table/resource
          items:
            $ref: '#/components/schemas/ConnectorColumn'
          type: array
        description:
          description: Optional description
          nullable: true
