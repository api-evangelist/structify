      operationId: admin_list_chat_templates
      parameters:
      - in: query
        name: chat_session_id
        required: false
        schema:
          allOf:
          - $ref: '#/components/schemas/ChatSessionId'
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ChatTemplate'
                type: array
          description: Chat templates retrieved
        '500':
          description: Internal server error
      security:
      - api_key: []
      - session_token: []
      tags:
      - Admin
      summary: Admin list chat templates
      x-summary-source: derived
    post:
      operationId: admin_create_chat_template
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateChatTemplateRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatTemplate'
          description: Chat template created
        '400':
          description: Bad request
        '403':
          description: Forbidden
        '404':
          description: Chat session not found
        '500':
          description: Internal server error
      security:
      - api_key: []
      - session_token: []
      tags:
      - Admin
      summary: Admin create chat template
      x-summary-source: derived
