summary: >-
  Structify publishes no pricing page. structify.ai/pricing, www.structify.ai/pricing
  and docs.structify.ai/pricing all return HTTP 404, and neither the site
  navigation nor the footer carries a pricing link — the commercial call to
  action is "Book a demo" (https://www.structify.ai/demo). Three tier NAMES are
  published, but only in the API Overview's rate-limit table, and no price,
  currency, billing period, included quota or overage is stated anywhere public.
  The tiers below are therefore recorded with prices null: they are real,
  provider-named plans with unpublished economics, which is a different fact
  from "no plans exist".
