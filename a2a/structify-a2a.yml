deviations:
- field: description
  issue: >-
    The A2A AgentCard object requires a root-level `description`. This card has
    none; the human-readable description lives only inside skills[0].description.
- field: protocolVersion
  issue: >-
    Declares protocolVersion "0.3" rather than a 1.x value, so the card is
    written against the pre-1.0 A2A protocol even though it is served from the
    current /.well-known/agent-card.json path.
- field: skills[].tags
  issue: >-
    skills[0].tags is an empty array. Tags are how an A2A client filters skills,
    so an untagged skill is discoverable only by reading its description.
- field: url / supportedInterfaces
  issue: >-
    Both `url` and supportedInterfaces[0].url point at the documentation site
    root (https://docs.structify.ai/), not at an A2A JSON-RPC endpoint. An A2A
    client cannot task this agent; the card functions as a discovery pointer to
    the docs and the published skill file rather than as a callable interface.
