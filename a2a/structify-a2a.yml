summary: >-
  Structify publishes a real A2A Agent Card from its own documentation host,
  docs.structify.ai. The card names Structify as the provider organization,
  declares one skill, and points that skill at a provider-published Agent Skill
  markdown file on the same host. It is served by the Mintlify-hosted docs site
  (x-matched-path /_sites/[subdomain]/.well-known/agent-card.json), but the
  document is Structify's own content on a Structify-controlled subdomain, so it
  is recorded as a first-party agent surface.
