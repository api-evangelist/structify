summary: >-
  This crosswalk records a total divergence, not an overlap. Structify's live
  MCP server operates on the DOCUMENTATION plane — its three tools search, read
  and file feedback on docs.structify.ai. The REST API operates on the DATA
  plane — 281 operations over datasets, entities, connectors, jobs, sessions and
  teams. There is not one binding between them: every MCP tool is mcp_only and
  every REST operation is rest_only. An agent that connects to Structify's MCP
  server can learn how Structify works but cannot do anything in Structify.
